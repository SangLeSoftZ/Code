spring.application.name=demo

# ── Kết nối MariaDB ───────────────────────────────────────────────────────────
# disableDefaultAuthentication=true  → tắt GSSAPI/Kerberos, dùng password thông thường
spring.datasource.url=jdbc:mariadb://localhost:3306/shop_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&disableDefaultAuthentication=true
spring.datasource.username=root
spring.datasource.password=sang123
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Khai báo rõ dialect để Hibernate không cần kết nối DB mới detect được
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080
